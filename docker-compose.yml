services:
  experiment:
    build: .
    container_name: rbtm-experiment
    restart: unless-stopped
    depends_on:
      tomograph_server:
        condition: service_started
    ports:
     - "5001:5001"
    volumes:
      - "./logs/experiment:/xtomo/logs"
    # environment:
    #   - LD_LIBRARY_PATH=/xtomo/vendor/ximea/libs/libusb/X64:/xtomo/vendor/ximea/libs/libraw1394/X64:/xtomo/vendor/ximea/api/X64

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
  
  # Отладочный GUI для Redis: docker compose --profile debug up -d redisinsight
  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["debug"]
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: always

  tomograph_server:
    build: .
    container_name: rbtm-tomograph-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    volumes:
      - "./logs/tomo_server:/xtomo/logs"
      # Монтируем всю USB-шину: XIMEA-камера доступна на любом порту
      # после переподключения без изменения конфига или перезапуска.
      - "/dev/bus/usb:/dev/bus/usb"
    devices:
      # ttyACM* — контроллеры моторов XIMC и затвор.
      # Числа могут меняться при переподключении USB, поэтому пробрасываем все
      # возможные номера. docker-entrypoint.sh восстанавливает симлинки
      # /dev/ximc/<SERIAL> -> /dev/ttyACMX внутри контейнера через sysfs,
      # благодаря чему devices.cfg (xi-com:///dev/ximc/<SERIAL>) остаётся стабильным.
      - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/ttyACM1:/dev/ttyACM1"
      - "/dev/ttyACM2:/dev/ttyACM2"
      - "/dev/ttyACM3:/dev/ttyACM3"
      # - "/dev/ttyACM4:/dev/ttyACM4"
      # FireWire: задать XIMEA_CAMERA_DEVICE=/dev/fw1:/dev/fw1 в restart_fw.sh
      # USB: переменная не нужна — камера доступна через /dev/bus/usb volume
      # Дефолт /dev/null — безвредный fallback когда переменная не задана
      - "${XIMEA_CAMERA_DEVICE:-/dev/null:/dev/null}"
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    # Разрешить доступ к USB-символьным устройствам (major 189 = /dev/bus/usb/*)
    device_cgroup_rules:
      - "c 189:* rmw"
    # xiAPI поднимает приоритет своих USB-потоков до realtime; без этого в логе
    # "xiAPI: Failed to change thread scheduler, check user limit for realtime
    # priority", а рабочие потоки SDK планируются как обычные и остановка/старт
    # захвата растягиваются. Нужны лимит rtprio и capability SYS_NICE.
    ulimits:
      rtprio: 99
      memlock: -1
    cap_add:
      - SYS_NICE
    environment:
      - LD_LIBRARY_PATH=/xtomo/vendor/ximea/libs/libusb/X64:/xtomo/vendor/ximea/libs/libraw1394/X64:/xtomo/vendor/ximea/api/X64
    entrypoint: ["/xtomo/docker-entrypoint.sh"]
    command: python tomograph_server.py
