[angle motor]
port = xi-com:///dev/ximc/0000037A
step_in_360 = 32400
speed = 500
acceleration = 500

[horizontal motor]
port = xi-com:///dev/ximc/00000271
speed = 200
acceleration = 200
# Позиция (в шагах), на которую нужно сместить мотор, чтобы вывести объект из рентгеновского пучка.
# Отрицательное значение — движение в сторону "парковки".
# TODO: архитектурная проблема — горизонтальный мотор линейный, но использует тот же
#       класс HWMotor, что и вращательный угловой мотор. Требуется рефакторинг на
#       отдельные классы HWRotaryMotor / HWLinearMotor.
move_object_outside = -4200

[shutter]
port = /dev/ttyACM2
relay = 4

[x-ray source]
port = /dev/ttyUSB0
