[angle motor]
port = xi-com:///dev/ximc/0000037A
step_in_360 = 32400
speed = 500
acceleration = 500

[horizontal motor]
port = xi-com:///dev/ximc/00000271
speed = 200
acceleration = 200
# 1 шаг = 5.0136 мкм → 1 мм = 199.46 шагов
steps_per_mm = 199.46
# Позиция (мм), на которую нужно сместить мотор, чтобы вывести объект из рентгеновского пучка.
# Отрицательное значение — движение в сторону "парковки". Эквивалентно ≈ -5984 шагам.
# Было -21.06 (≈ -4200 шагов): при съёмке пустых пучков правая стенка эппендорфа и край образца оставались в
# поле детектора (скан dc5548a3 от 01.10.2026, MH110XC 9 мкм: сдвиг 2356 px, пробирка в кадре x 1300–2830).
# Нужно ≥ 27 мм; -30 мм — с запасом. Концевые ограничения в драйвере выключены (BorderFlags = 0): после смены
# проверить ход вручную (move-away / move-back), что держатель ни во что не упирается.
move_object_outside_mm = -30.0

[shutter]
port = /dev/ttyACM2
relay = 4

[x-ray source]
port = /dev/ttyUSB0
mock = false
